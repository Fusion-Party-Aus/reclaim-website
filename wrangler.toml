name = "fusion-website"
compatibility_date = "2025-01-29"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"

[[kv_namespaces]]
# Run `wrangler kv namespace create NATIONBUILDER_TOKENS` to get the id, then paste it below.
binding = "NATIONBUILDER_TOKENS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[observability]
enabled = false

[observability.logs]
enabled = true
invocation_logs = true
persist = true
